<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: rgba(255,255,255,0.85);
    user-select: none;
    padding: 6px;
  }
  .widget {
    background: rgba(28, 28, 32, 0.92);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    overflow: hidden;
    height: 100%;
    display: flex; flex-direction: column;
    backdrop-filter: blur(20px);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    -webkit-app-region: drag;
  }
  .header-left { display: flex; align-items: center; gap: 6px; }
  .header-right { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
  .title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); letter-spacing: -0.2px; }
  .badge {
    font-size: 8px; font-weight: 600; padding: 2px 6px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .badge-live { color: #34D399; background: rgba(52,211,153,0.12); }
  .badge-demo { color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }
  .badge-plan { color: #8B5CF6; background: rgba(139,92,246,0.12); }
  .win-btn {
    width: 12px; height: 12px; border-radius: 50%;
    border: none; cursor: pointer; transition: opacity 0.2s;
    -webkit-app-region: no-drag;
  }
  .win-btn:hover { opacity: 0.8; }
  .btn-close { background: #FF5F57; }
  .btn-minimize { background: #FEBC2E; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 1px; font-size: 11px; }
  .banner {
    padding: 4px 12px; text-align: center;
    border-bottom: 1px solid rgba(52,211,153,0.1);
    background: linear-gradient(90deg, rgba(52,211,153,0.1), rgba(251,191,36,0.1));
    font-size: 10px; color: #34D399; font-weight: 500;
    display: none;
  }
  .banner.visible { display: block; }
  .scene { padding: 4px 8px 0; display: flex; justify-content: center; flex-shrink: 0; }
  .status-line { text-align: center; padding: 0 12px 4px; font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 500; }
  .countdown-box {
    margin: 0 12px 8px; padding: 8px 10px;
    border-radius: 10px; text-align: center;
    transition: all 0.4s;
  }
  .countdown-time {
    font-size: 28px; font-weight: 700; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
    transition: color 0.4s;
  }
  .countdown-label {
    font-size: 9px; color: rgba(255,255,255,0.3); margin-top: 2px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .meters { padding: 0 12px 8px; flex-shrink: 0; }
  .meter { margin-bottom: 6px; }
  .meter:last-child { margin-bottom: 0; }
  .meter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .meter-label { font-size: 9px; color: rgba(255,255,255,0.45); font-weight: 500; }
  .meter-right { display: flex; align-items: center; gap: 6px; }
  .burn-badge { font-size: 8px; font-weight: 600; }
  .meter-value { font-size: 9px; font-weight: 600; font-variant-numeric: tabular-nums; transition: color 0.4s; }
  .meter-track { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease, background 0.4s; }
  .meter-sub { font-size: 8px; color: rgba(255,255,255,0.2); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .footer {
    padding: 6px 12px 8px;
    border-top: 1px solid rgba(255,255,255,0.04);
    margin-top: auto;
  }
  .btn {
    width: 100%; padding: 6px 0; border-radius: 7px;
    background: rgba(91,141,239,0.1); border: 1px solid rgba(91,141,239,0.12);
    color: #5B8DEF; font-size: 10px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; -webkit-app-region: no-drag;
  }
  .btn:hover { background: rgba(91,141,239,0.18); }
  .btn:disabled { opacity: 0.4; cursor: wait; }
  .conn-bar {
    padding: 3px 12px; text-align: center;
    font-size: 8px; color: rgba(255,255,255,0.2);
    display: flex; justify-content: center; align-items: center; gap: 3px;
  }
  .conn-dot { width: 4px; height: 4px; border-radius: 50%; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; transition: all 0.4s; }
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="header-left">
      <button class="win-btn btn-close" onclick="window.claude.close()" title="Quit"></button>
      <button class="win-btn btn-minimize" onclick="window.claude.minimize()" title="Hide"></button>
      <span class="title" style="margin-left:4px">🐹 Claude Runner</span>
    </div>
    <div class="header-right">
      <span class="badge badge-plan" id="planBadge" style="display:none"></span>
      <span class="badge badge-demo" id="modeBadge">DEMO</span>
      <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="Toggle sound">🔔</button>
    </div>
  </div>

  <div class="banner" id="banner">✨ Limit restored — runner is back! ✨</div>

  <div class="scene"><svg id="scene" width="100" height="85" viewBox="0 0 100 85"></svg></div>

  <div class="status-line" id="statusLine">🐹 Connecting…</div>

  <!-- BIG COUNTDOWN -->
  <div class="countdown-box" id="countdownBox"
    style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04);">
    <div class="countdown-time" id="countdownTime" style="color:rgba(255,255,255,0.8)">--:--</div>
    <div class="countdown-label" id="countdownLabel">Session reset countdown</div>
  </div>

  <div class="meters">
    <div class="meter">
      <div class="meter-header">
        <span class="meter-label">Session (5h)</span>
        <div class="meter-right">
          <span class="burn-badge" id="burnBadge"></span>
          <span class="meter-value" id="sessionValue">0%</span>
        </div>
      </div>
      <div class="meter-track"><div class="meter-fill" id="sessionFill"></div></div>
    </div>
    <div class="meter">
      <div class="meter-header">
        <span class="meter-label">Weekly (7d)</span>
        <span class="meter-value" id="weeklyValue">0%</span>
      </div>
      <div class="meter-track"><div class="meter-fill" id="weeklyFill"></div></div>
      <div class="meter-sub" id="weeklyReset">↻ --</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn" id="actionBtn" onclick="doRefresh()">↻ Refresh</button>
  </div>

  <div class="conn-bar">
    <div class="conn-dot" id="connDot" style="background:#FBBF24"></div>
    <span id="connLabel">Starting…</span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
const state = {
  sessionPct: 0, weeklyPct: 0,
  sessionResetAt: null, weeklyResetAt: null,
  mock: true, soundOn: true,
  celebrating: false, prevSessionPct: 0,
  plan: '', burnSpeed: 0.3,
};
let tick = 0;
const pctHistory = [];

// ═══════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════
function usageColor(p) { return p >= 90 ? '#F87171' : p >= 70 ? '#FBBF24' : '#34D399'; }

function fmtCountdown(ms) {
  if (!ms || ms <= 0) return '0:00';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

function fmtLabel(ms) {
  if (!ms || ms <= 0) return 'Session ready';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  if (h > 24) return 'Resets in ' + Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  if (h > 0) return 'Resets in ' + h + 'h ' + m + 'm';
  return 'Resets in ' + m + 'm';
}

// ═══════════════════════════════════════════
//  Sound: snore + chime
// ═══════════════════════════════════════════
let snoreCtx, snoreOsc, snoreLfo, snoreLfoGain, snoreGain, snoring = false;

function startSnore() {
  if (snoring || !state.soundOn) return;
  try {
    snoreCtx = new AudioContext();
    snoreOsc = snoreCtx.createOscillator();
    snoreOsc.type = 'sine'; snoreOsc.frequency.value = 75;
    snoreGain = snoreCtx.createGain(); snoreGain.gain.value = 0;
    snoreLfo = snoreCtx.createOscillator();
    snoreLfo.type = 'sine'; snoreLfo.frequency.value = 0.35;
    snoreLfoGain = snoreCtx.createGain(); snoreLfoGain.gain.value = 0.06;
    snoreLfo.connect(snoreLfoGain);
    snoreLfoGain.connect(snoreGain.gain);
    snoreOsc.connect(snoreGain).connect(snoreCtx.destination);
    snoreOsc.start(); snoreLfo.start();
    snoring = true;
  } catch {}
}

function stopSnore() {
  if (!snoring) return;
  try { snoreOsc?.stop(); snoreLfo?.stop(); snoreCtx?.close(); } catch {}
  snoring = false; snoreCtx = null;
}

function playChime() {
  try {
    const ctx = new AudioContext();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
      g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + i * 0.12 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.5);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.12);
      o.stop(ctx.currentTime + i * 0.12 + 0.5);
    });
  } catch {}
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('soundBtn').textContent = state.soundOn ? '🔔' : '🔕';
  if (!state.soundOn) stopSnore();
  else if (state.sessionPct >= 100 && !state.celebrating) startSnore();
}

// ═══════════════════════════════════════════
//  SVG setup
// ═══════════════════════════════════════════
const svg = document.getElementById('scene');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const [k,v] of Object.entries(a||{})) e.setAttribute(k,v); (p||svg).appendChild(e); return e; }

// Wheel
const wheelG = el('g',{});
el('line',{x1:50,y1:68,x2:38,y2:80,stroke:'#4A4A5A','stroke-width':2.5,'stroke-linecap':'round'},wheelG);
el('line',{x1:50,y1:68,x2:62,y2:80,stroke:'#4A4A5A','stroke-width':2.5,'stroke-linecap':'round'},wheelG);
el('line',{x1:34,y1:80,x2:66,y2:80,stroke:'#4A4A5A','stroke-width':2,'stroke-linecap':'round'},wheelG);
el('circle',{cx:50,cy:36,r:30,fill:'none',stroke:'rgba(255,255,255,0.06)','stroke-width':4},wheelG);
const usageArc = el('circle',{cx:50,cy:36,r:30,fill:'none',stroke:'#34D399','stroke-width':4,opacity:0.35,'stroke-dasharray':'0 189',transform:'rotate(-90 50 36)'},wheelG);
const spokesG = el('g',{},wheelG);
for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;el('line',{x1:50,y1:36,x2:50+Math.cos(a)*28,y2:36+Math.sin(a)*28,stroke:'rgba(255,255,255,0.08)','stroke-width':1},spokesG);}
for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2;el('line',{x1:50+Math.cos(a)*24,y1:36+Math.sin(a)*24,x2:50+Math.cos(a)*28,y2:36+Math.sin(a)*28,stroke:'rgba(255,255,255,0.05)','stroke-width':1.5},spokesG);}
el('circle',{cx:50,cy:36,r:3,fill:'#3A3A4A',stroke:'rgba(255,255,255,0.1)','stroke-width':1},wheelG);

// Hamster parts
const hamsterG = el('g',{});
const h = {};
h.tail = el('path',{d:'M 9 2 Q 16 -2 14 -6',stroke:'#C4845E','stroke-width':2,fill:'none','stroke-linecap':'round'},hamsterG);
h.bl1 = el('line',{x1:5,y1:5,x2:5,y2:12,stroke:'#B8835A','stroke-width':2.5,'stroke-linecap':'round'},hamsterG);
h.bl2 = el('line',{x1:2,y1:5,x2:2,y2:12,stroke:'#B8835A','stroke-width':2.5,'stroke-linecap':'round'},hamsterG);
h.body = el('ellipse',{cx:0,cy:0,rx:10,ry:7,fill:'#D4956B'},hamsterG);
el('ellipse',{cx:-2,cy:2,rx:6,ry:4,fill:'#E8C4A0',opacity:0.5},hamsterG);
h.fl1 = el('line',{x1:-6,y1:5,x2:-6,y2:12,stroke:'#C4845E','stroke-width':2.5,'stroke-linecap':'round'},hamsterG);
h.fl2 = el('line',{x1:-3,y1:5,x2:-3,y2:12,stroke:'#C4845E','stroke-width':2.5,'stroke-linecap':'round'},hamsterG);
h.head = el('circle',{cx:-9,cy:-3,r:7,fill:'#E0A878'},hamsterG);
h.cheek = el('circle',{cx:-5,cy:0,r:2.5,fill:'#E8967A',opacity:0.4},hamsterG);
el('ellipse',{cx:-14,cy:-8,rx:3,ry:4,fill:'#C4845E'},hamsterG);
el('ellipse',{cx:-14,cy:-8,rx:1.8,ry:2.5,fill:'#E8B090'},hamsterG);
el('ellipse',{cx:-5,cy:-9,rx:3,ry:4,fill:'#C4845E'},hamsterG);
el('ellipse',{cx:-5,cy:-9,rx:1.8,ry:2.5,fill:'#E8B090'},hamsterG);
h.e1 = el('circle',{cx:-12,cy:-4,r:1.5,fill:'#2D1A0E'},hamsterG);
h.e2 = el('circle',{cx:-7,cy:-4,r:1.5,fill:'#2D1A0E'},hamsterG);
h.sh1 = el('circle',{cx:-11.5,cy:-4.5,r:0.5,fill:'white'},hamsterG);
h.sh2 = el('circle',{cx:-6.5,cy:-4.5,r:0.5,fill:'white'},hamsterG);
el('circle',{cx:-9.5,cy:-1.5,r:1,fill:'#8B5E3C'},hamsterG);
h.mouth = el('path',{d:'M -11 0 Q -9.5 2 -8 0',stroke:'#8B5E3C','stroke-width':0.7,fill:'none'},hamsterG);
h.sweat = el('text',{x:4,y:-10,'font-size':5,fill:'#60A5FA',opacity:0},hamsterG); h.sweat.textContent='💧';
h.zG = el('g',{opacity:0},hamsterG);
for(let i=0;i<3;i++){const t=el('text',{x:5+i*6,y:-8-i*6,'font-size':8-i,fill:`rgba(255,255,255,${0.3-i*0.08})`,'font-weight':'bold'},h.zG);t.textContent='z';h.zG['z'+i]=t;}
h.stG = el('g',{opacity:0},hamsterG);
for(let i=0;i<3;i++){const s=el('text',{x:0,y:0,'font-size':6,fill:'#FBBF24',opacity:0.7,'text-anchor':'middle'},h.stG);s.textContent='✦';h.stG['s'+i]=s;}
// Snore bubbles
h.sb1 = el('circle',{cx:5,cy:-4,r:0,fill:'none',stroke:'rgba(255,255,255,0.15)','stroke-width':0.8},hamsterG);
h.sb2 = el('circle',{cx:8,cy:-8,r:0,fill:'none',stroke:'rgba(255,255,255,0.1)','stroke-width':0.6},hamsterG);
h.spG = el('g',{opacity:0},hamsterG);
for(let i=0;i<5;i++){const s=el('text',{x:0,y:0,'font-size':7},h.spG);s.textContent='✨';h.spG['p'+i]=s;}

// ═══════════════════════════════════════════
//  Animation
// ═══════════════════════════════════════════
const legs=[[20,-15,-20,15],[35,-30,-35,30],[15,-10,-15,10],[-10,20,10,-20]];
const sin=Math.sin,cos=Math.cos,PI=Math.PI;

function animate(){
  tick++;
  const p=state.sessionPct, exh=p>=100&&!state.celebrating;
  // Base speed from current usage %, burn rate adds on top
  const baseSpd = p >= 90 ? 2.5 : p >= 60 ? 1.8 : p >= 20 ? 1 : p > 0 ? 0.6 : 0;
  const spd = Math.min(3, Math.max(baseSpd, state.burnSpeed));
  const wheelSpd = exh ? 0 : 1 + spd * 4;
  spokesG.setAttribute('transform',`rotate(${exh?0:tick*wheelSpd} 50 36)`);
  const circ=2*PI*30, arc=(Math.min(p,100)/100)*circ;
  usageArc.setAttribute('stroke-dasharray',`${arc} ${circ}`);
  usageArc.setAttribute('stroke',usageColor(p));

  if(exh){
    hamsterG.setAttribute('transform','translate(50,34)');
    h.body.setAttribute('rx',11);h.body.setAttribute('ry',6);h.body.setAttribute('transform','rotate(15)');
    h.head.setAttribute('cx',-10);h.head.setAttribute('cy',-1);
    h.e1.setAttribute('r',0);h.e2.setAttribute('r',0);h.sh1.setAttribute('r',0);h.sh2.setAttribute('r',0);
    h.mouth.setAttribute('d','');
    h.cheek.setAttribute('cx',-10);h.cheek.setAttribute('cy',3);h.cheek.setAttribute('rx',2);h.cheek.setAttribute('ry',1.2);
    h.cheek.setAttribute('fill','#FF8A8A');h.cheek.setAttribute('opacity',1);
    [h.fl1,h.fl2,h.bl1,h.bl2].forEach(l=>l.setAttribute('opacity',0.3));
    h.zG.setAttribute('opacity',1);
    for(let i=0;i<3;i++) h.zG['z'+i].setAttribute('y',-8-i*6+sin(tick*0.04+i)*2);
    h.stG.setAttribute('opacity',1);
    for(let i=0;i<3;i++){const a=tick*0.03+i*2.09;h.stG['s'+i].setAttribute('x',-10+cos(a)*12);h.stG['s'+i].setAttribute('y',-8+sin(a)*5);}
    // Snore bubbles
    const sc = (tick*0.02)%(PI*2);
    const br = 3+sin(sc)*2;
    h.sb1.setAttribute('r',br);h.sb1.setAttribute('cy',-4-sin(tick*0.025)*3);
    h.sb2.setAttribute('r',br>3.5?br*0.5:0);h.sb2.setAttribute('cy',-8-sin(tick*0.025)*2);
    h.sweat.setAttribute('opacity',0);h.spG.setAttribute('opacity',0);
    if(!snoring&&state.soundOn) startSnore();
  } else {
    if(snoring) stopSnore();
    const by=26-(spd>0?Math.abs(sin(tick*(0.04+spd*0.03)))*(1.5+spd*1.5):0)-(state.celebrating?Math.abs(sin(tick*0.08))*8:0);
    hamsterG.setAttribute('transform',`translate(50,${by})`);
    h.body.setAttribute('rx',10);h.body.setAttribute('ry',7+sin(tick*0.05)*0.3);h.body.setAttribute('transform','');
    h.head.setAttribute('cx',-9);h.head.setAttribute('cy',-3);
    h.e1.setAttribute('r',1.5);h.e2.setAttribute('r',1.5);
    h.sh1.setAttribute('r',spd>=2.5?0:0.5);h.sh2.setAttribute('r',spd>=2.5?0:0.5);
    h.cheek.setAttribute('cx',-5);h.cheek.setAttribute('cy',0);h.cheek.setAttribute('rx',2.5);h.cheek.setAttribute('ry',2.5);
    h.cheek.setAttribute('fill','#E8967A');h.cheek.setAttribute('opacity',0.4);
    if(spd>=1.5){h.mouth.setAttribute('d',`M -11 0 Q -9.5 ${2+1+sin(tick*0.08)*0.5} -8 0`);h.mouth.setAttribute('fill','#C4645A');h.mouth.setAttribute('stroke','none');}
    else{h.mouth.setAttribute('d','M -11 0 Q -9.5 2 -8 0');h.mouth.setAttribute('fill','none');h.mouth.setAttribute('stroke','#8B5E3C');}
    [h.fl1,h.fl2,h.bl1,h.bl2].forEach(l=>l.setAttribute('opacity',1));
    const f=tick%4,lg=spd>0?legs[f]:[5,-5,-5,5];
    h.fl1.setAttribute('x2',-6+sin(lg[0]*PI/180)*7);h.fl1.setAttribute('y2',5+cos(lg[0]*PI/180)*7);
    h.fl2.setAttribute('x2',-3+sin(lg[1]*PI/180)*7);h.fl2.setAttribute('y2',5+cos(lg[1]*PI/180)*7);
    h.bl1.setAttribute('x2',5+sin(lg[2]*PI/180)*7);h.bl1.setAttribute('y2',5+cos(lg[2]*PI/180)*7);
    h.bl2.setAttribute('x2',2+sin(lg[3]*PI/180)*7);h.bl2.setAttribute('y2',5+cos(lg[3]*PI/180)*7);
    const tw=sin(tick*0.05)*1.5;
    h.tail.setAttribute('d',`M 9 2 Q 16 ${-2+tw} 14 ${-6+tw*0.5}`);
    h.sweat.setAttribute('opacity',spd>=2.5?0.5+sin(tick*0.07)*0.3:0);
    h.sb1.setAttribute('r',0);h.sb2.setAttribute('r',0);
    h.zG.setAttribute('opacity',0);h.stG.setAttribute('opacity',0);
    if(state.celebrating){h.spG.setAttribute('opacity',1);for(let i=0;i<5;i++){const a=tick*0.04+i*1.26,r=16+sin(tick*0.05+i)*4;h.spG['p'+i].setAttribute('x',cos(a)*r-4);h.spG['p'+i].setAttribute('y',sin(a)*r-6);h.spG['p'+i].setAttribute('opacity',0.5+sin(tick*0.07+i)*0.4);}}
    else h.spG.setAttribute('opacity',0);
  }
}

let lastFrame=0;
function loop(ts){if(ts-lastFrame>=83){lastFrame=ts;animate();}requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ═══════════════════════════════════════════
//  Burn rate tracker
// ═══════════════════════════════════════════
function trackBurn(pct) {
  const now = Date.now();
  pctHistory.push({ t: now, pct });
  while (pctHistory.length > 0 && now - pctHistory[0].t > 60000) pctHistory.shift();
  if (pctHistory.length >= 2) {
    const first = pctHistory[0], last = pctHistory[pctHistory.length - 1];
    const dt = (last.t - first.t) / 1000;
    const dp = last.pct - first.pct;
    if (dt > 0) {
      const rate = dp / dt; // %/sec
      state.burnSpeed = rate <= 0 ? 0.3 : Math.min(3, rate * 50);
    }
  }
  // Update burn badge
  const bb = document.getElementById('burnBadge');
  if (state.burnSpeed >= 2.5) { bb.textContent = '🔥 FAST'; bb.style.color = '#F87171'; }
  else if (state.burnSpeed >= 1.5) { bb.textContent = '⚡ MED'; bb.style.color = '#FBBF24'; }
  else if (state.burnSpeed >= 0.5) { bb.textContent = ''; }
  else { bb.textContent = ''; }
}

// ═══════════════════════════════════════════
//  UI update
// ═══════════════════════════════════════════
function updateUI() {
  const p = state.sessionPct, c = usageColor(p);
  document.getElementById('sessionValue').textContent = Math.round(p) + '%';
  document.getElementById('sessionValue').style.color = c;
  document.getElementById('sessionFill').style.width = Math.min(p,100) + '%';
  document.getElementById('sessionFill').style.background = c;

  const wc = usageColor(state.weeklyPct);
  document.getElementById('weeklyValue').textContent = Math.round(state.weeklyPct) + '%';
  document.getElementById('weeklyValue').style.color = wc;
  document.getElementById('weeklyFill').style.width = Math.min(state.weeklyPct,100) + '%';
  document.getElementById('weeklyFill').style.background = wc;

  // Status line
  const sl = document.getElementById('statusLine');
  const exh = p >= 100;
  if (exh && !state.celebrating) sl.textContent = '💤 Limit hit — snoring away';
  else if (state.celebrating) sl.textContent = '✨ Back in action!';
  else if (p >= 90) sl.textContent = '🏃 Almost there — sprinting!';
  else if (state.burnSpeed >= 2) sl.textContent = '🔥 Burning fast!';
  else if (p >= 60) sl.textContent = '😤 Picking up pace';
  else if (p >= 20) sl.textContent = '🐹 Jogging along nicely';
  else if (p > 0) sl.textContent = '😌 Easy trot';
  else sl.textContent = '✨ Fresh and ready';

  // Countdown box styling
  const box = document.getElementById('countdownBox');
  const ct = document.getElementById('countdownTime');
  if (exh && !state.celebrating) {
    box.style.background = 'rgba(248,113,113,0.08)';
    box.style.border = '1px solid rgba(248,113,113,0.12)';
    ct.style.color = '#F87171';
    document.getElementById('countdownLabel').textContent = 'Until session restores';
  } else {
    box.style.background = 'rgba(255,255,255,0.03)';
    box.style.border = '1px solid rgba(255,255,255,0.04)';
    ct.style.color = 'rgba(255,255,255,0.8)';
    document.getElementById('countdownLabel').textContent = 'Session reset countdown';
  }

  // Badges
  const mb = document.getElementById('modeBadge');
  mb.textContent = state.mock ? 'DEMO' : 'LIVE';
  mb.className = 'badge ' + (state.mock ? 'badge-demo' : 'badge-live');
  const pb = document.getElementById('planBadge');
  if (state.plan && state.plan !== 'demo' && state.plan !== 'unknown') {
    pb.textContent = state.plan.toUpperCase();
    pb.style.display = 'inline';
  } else {
    pb.style.display = 'none';
  }
}

// Countdown tick every second
setInterval(() => {
  const now = Date.now();
  if (state.sessionResetAt) {
    const ms = Math.max(0, new Date(state.sessionResetAt) - now);
    document.getElementById('countdownTime').textContent = fmtCountdown(ms);
  }
  if (state.weeklyResetAt) {
    const ms = Math.max(0, new Date(state.weeklyResetAt) - now);
    document.getElementById('weeklyReset').textContent = '↻ ' + fmtLabel(ms);
  }
}, 1000);

// ═══════════════════════════════════════════
//  IPC from main process
// ═══════════════════════════════════════════
window.claude.onUsageUpdate((data) => {
  state.prevSessionPct = state.sessionPct;
  state.sessionPct = data.session?.pct ?? 0;
  state.weeklyPct = data.weekly?.pct ?? 0;
  state.sessionResetAt = data.session?.resetAt;
  state.weeklyResetAt = data.weekly?.resetAt;
  state.mock = data.mock !== false;
  state.plan = data.plan || '';

  trackBurn(state.sessionPct);

  // Detect reset
  if (state.prevSessionPct >= 90 && state.sessionPct < 15) {
    state.celebrating = true;
    stopSnore();
    if (state.soundOn) playChime();
    document.getElementById('banner').classList.add('visible');
    setTimeout(() => {
      state.celebrating = false;
      document.getElementById('banner').classList.remove('visible');
    }, 3500);
  }

  document.getElementById('connDot').style.background = '#34D399';
  document.getElementById('connLabel').textContent = state.mock ? 'Demo data' : 'Live · polling 3m';
  updateUI();
});

async function doRefresh() {
  const btn = document.getElementById('actionBtn');
  btn.disabled = true; btn.textContent = '↻ Refreshing…';
  await window.claude.refresh();
  btn.disabled = false; btn.textContent = '↻ Refresh';
}
</script>
